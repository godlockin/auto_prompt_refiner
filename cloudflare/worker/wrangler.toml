name = "synthesis-prime-worker"
main = "src/index.ts"
compatibility_date = "2024-02-08"

# KV Namespace for storing task history
# Run `wrangler kv:namespace create TASKS` to get the ID and replace it here
[[kv_namespaces]]
binding = "TASKS"
id = "YOUR_KV_NAMESPACE_ID_HERE"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID_HERE"

[vars]
# Default variables (Secrets should be set via `wrangler secret put`)
GEMINI_MODEL = "gemini-2.0-flash" 

# Vertex AI Fallback Configuration (Secrets: VERTEX_PRIVATE_KEY, VERTEX_CLIENT_EMAIL)
VERTEX_PROJECT_ID = "ingka-aid-content-prod" # Update with your GCP Project ID
VERTEX_LOCATION = "us-central1" 

# CORS settings
# [site]
# bucket = "../frontend/dist" 
# If deploying purely as a Worker serving assets, otherwise use Cloudflare Pages for frontend
